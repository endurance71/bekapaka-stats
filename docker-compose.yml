version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      # DEV ONLY — do not use these credentials in production
      POSTGRES_USER: bekapaka
      POSTGRES_PASSWORD: bekapaka_pass
      POSTGRES_DB: bekapaka_stats
    ports:
      - "5433:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      # DEV ONLY
      DATABASE_URL: postgres://bekapaka:bekapaka_pass@db:5432/bekapaka_stats
      DB_HOST: db
      DB_USER: bekapaka
      DB_PASSWORD: bekapaka_pass
      DB_NAME: bekapaka_stats
      JWT_SECRET: ${JWT_SECRET:-dev-only-docker-compose-jwt-secret-min-32-chars}
      PORT: 4000
      TZ: Europe/Warsaw
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app_sync:delegated
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app_sync:delegated
      - ./packages:/packages:delegated
      - /app/node_modules
    environment:
      TZ: Europe/Warsaw
      SAFARI_OVERLAY_PATH: /packages/safari-overlay
      VITE_API_TARGET: http://backend:4000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "8080:5173"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
