name: Deploy to VPS

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

      - name: Build and push public Site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/site:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/bekapaka-stats/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: CR_PAT,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            set -euo pipefail
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd /opt/bekapaka-stats
            docker pull "ghcr.io/${GITHUB_REPOSITORY}/backend:latest"
            docker pull "ghcr.io/${GITHUB_REPOSITORY}/frontend:latest"
            docker pull "ghcr.io/${GITHUB_REPOSITORY}/site:latest"
            # Usuń osierocone kontenery po nieudanym recreate (np. abc123_bkpk-backend-prod)
            # grep zwraca 1 gdy brak dopasowań — nie może zabić skryptu przy set -o pipefail
            orphans="$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]+_bkpk-(backend|frontend|site|cms)-prod$' || true)"
            if [ -n "$orphans" ]; then
              echo "$orphans" | xargs -r docker rm -f
            fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker image prune -f
