name: Deploy to VPS

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

# Deploy (push / ręcznie) — jedna kolejka produkcyjna. PR-y (tylko testy) mają własną grupę per gałąź:
# GitHub trzyma w grupie jeden oczekujący przebieg, więc wspólna grupa wyrzucała czekające deploye z main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'bekapaka-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            site/package-lock.json
            cms-app/package-lock.json
            packages/safari-overlay/package-lock.json
      - name: Shared Safari overlay dependencies
        working-directory: packages/safari-overlay
        run: npm ci
      - name: Backend tests and Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          npm test -- --run
      - name: KALK scraper fetch regressions
        run: |
          python3 -m venv /tmp/bkpk-scraper-tests
          /tmp/bkpk-scraper-tests/bin/pip install -r backend/scripts/requirements.txt
          (cd backend/scripts && /tmp/bkpk-scraper-tests/bin/python -m unittest discover -p 'test_kalk_*.py' -v)
      - name: CMS backup helper regressions
        run: python3 -m unittest discover -s scripts/vps -p 'test_cms_release.py' -v
      - name: Media consent seed regressions
        run: node --test scripts/vps/seed-media-records.test.mjs
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Brand tokens are in sync with tokens.json
        run: |
          python3 packages/digital-design/build_tokens.py
          git diff --exit-code packages/digital-design/dist
      - name: Public site quality
        working-directory: site
        run: |
          npm ci
          npm test
          npm run quality
      - name: CMS build
        working-directory: cms-app
        run: |
          npm ci
          npm test
          npm run build
      - name: Dependency audit (critical gate)
        run: |
          set -euo pipefail
          for service in backend frontend site cms-app; do
            echo "::group::${service} production dependencies"
            (cd "$service" && npm audit --omit=dev --audit-level=critical)
            echo '::endgroup::'
          done

  docker-build-smoke:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile.prod
          - name: site
            context: .
            dockerfile: ./site/Dockerfile.prod
          - name: cms
            context: ./cms-app
            dockerfile: ./cms-app/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

      - name: Build and push public Site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/site:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/site:latest

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: ./cms-app
          file: ./cms-app/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cms:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cms:latest

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/bekapaka-stats/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: CR_PAT,GITHUB_ACTOR,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID
          script: |
            set -euo pipefail
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd /opt/bekapaka-stats
            rollback_tag="rollback-${GITHUB_RUN_ID}"
            for service in backend frontend site; do
              old_image="$(docker inspect --format '{{.Image}}' "bkpk-${service}-prod")"
              docker tag "$old_image" "ghcr.io/${GITHUB_REPOSITORY}/${service}:${rollback_tag}"
            done
            export BKPK_IMAGE_TAG="$GITHUB_SHA"
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull bkpk-backend bkpk-frontend bkpk-site
            deployed=()
            rollback() {
              echo 'Wdrażanie nieudane; przywracam poprzednie obrazy zmienionych usług.' >&2
              export BKPK_IMAGE_TAG="$rollback_tag"
              for ((i=${#deployed[@]}-1; i>=0; i--)); do
                docker compose -f docker-compose.prod.yml up -d --no-deps "bkpk-${deployed[i]}" || true
              done
            }
            deploy_one() {
              service="$1"
              endpoint="$2"
              deployed+=("$service")
              if ! docker compose -f docker-compose.prod.yml up -d --no-deps "bkpk-$service"; then
                rollback
                exit 1
              fi
              healthy=false
              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 3 "$endpoint" >/dev/null; then
                  healthy=true
                  break
                fi
                sleep 2
              done
              if [ "$healthy" != true ]; then
                echo "Kontrola zdrowia usługi $service nie powiodła się." >&2
                rollback
                exit 1
              fi
            }
            deploy_one backend http://127.0.0.1:4001/api/health
            deploy_one site http://127.0.0.1:8082/
            deploy_one frontend http://127.0.0.1:8081/
            # Strona jest prerenderowana w CI bez backendu i CMS — w cache leżą stany „Nie można pobrać”.
            # Odświeżamy cache i renderujemy główne trasy (dwa przejścia: stara wersja → regeneracja), zanim wejdą odwiedzający.
            secret="$(grep -E '^SITE_REVALIDATE_SECRET=' .env | cut -d= -f2- || true)"
            [ -n "$secret" ] || secret="$(grep -E '^PREVIEW_SECRET=' .env | cut -d= -f2- || true)"
            if [ -n "$secret" ]; then
              curl -fsS -o /dev/null --max-time 20 -X POST -H "x-revalidate-secret: $secret" http://127.0.0.1:8082/api/revalidate || echo 'Odświeżenie cache strony nie powiodło się.' >&2
            fi
            for pass in 1 2; do
              for route in / /mecze '/mecze?widok=wyniki' /tabela /sklad /aktualnosci /sponsorzy /klub /dokumenty; do
                curl -fsS -o /dev/null --max-time 30 "http://127.0.0.1:8082${route}" || echo "Rozgrzanie ${route} nie powiodło się." >&2
              done
              sleep 5
            done
            echo 'Wdrażanie zakończone pomyślnie. Zachowuję obrazy rollbacku.'
            # Shared VPS: global pruning can remove rollback images of other projects.
            # Review BeKaPaKa image retention separately before deleting old releases.


  # Studio (studio.bekapaka.pl: SPA + render worker) is not part of the deploy above; it is updated
  # only by scripts/studio/deploy.sh. A backend and Studio on different builds break renders
  # („Implementacja tej rewizji została zarchiwizowana”) and once looped the editor autosave.
  # This job compares the running Studio with this release. Without the repository variable
  # STUDIO_AUTO_DEPLOY=true it only fails loudly with the command to run; with it, it waits for
  # „Studio quality and images” of this SHA and runs deploy.sh (two Studio services only, no MOYA).
  studio:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      # Everything the Studio images are built from (studio/Dockerfile, backend/studio/Dockerfile.worker).
      STUDIO_PATHS: studio backend/studio backend/ai-engine backend/prisma backend/lib/prisma.js backend/prisma.config.js backend/package.json backend/package-lock.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH access to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/vps\n  BatchMode yes\n  StrictHostKeyChecking accept-new\n' \
            "$VPS_HOST" "$VPS_USER" "${VPS_SSH_PORT:-22}" > ~/.ssh/config

      - name: Compare running Studio with this release
        id: drift
        run: |
          set -euo pipefail
          image="$(ssh vps "docker inspect --format '{{.Config.Image}}' bkpk-studio-prod" 2>/dev/null || true)"
          running="${image##*:}"
          echo "running=${running:-brak}" >> "$GITHUB_OUTPUT"
          if [ "$running" = "$GITHUB_SHA" ]; then
            drift=false
          elif [[ "$running" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${running}^{commit}" 2>/dev/null \
            && git diff --quiet "$running" "$GITHUB_SHA" -- $STUDIO_PATHS; then
            drift=false
          else
            drift=true
          fi
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "Studio na VPS: ${image:-brak kontenera}; to wydanie: $GITHUB_SHA; wymaga wdrożenia: $drift"

      - name: Studio left behind
        if: steps.drift.outputs.drift == 'true' && vars.STUDIO_AUTO_DEPLOY != 'true'
        env:
          RUNNING: ${{ steps.drift.outputs.running }}
        run: |
          {
            echo '### Studio nie jest wdrożone'
            echo
            echo "Na VPS działa Studio \`${RUNNING}\`, a backend jest już na \`${GITHUB_SHA}\` i pliki Studio się zmieniły."
            echo 'Gdy workflow „Studio quality and images” dla tego SHA zakończy się sukcesem, uruchom na VPS:'
            echo
            echo '```bash'
            echo "cd /opt/bekapaka-stats && bash scripts/studio/deploy.sh ${GITHUB_SHA}"
            echo '```'
            echo
            echo 'Automatyczne wdrożenie: zmienna repozytorium `STUDIO_AUTO_DEPLOY=true`.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Studio nie jest wdrożone::Studio działa na ${RUNNING}, backend na ${GITHUB_SHA}. Uruchom scripts/studio/deploy.sh ${GITHUB_SHA} na VPS."
          exit 1

      - name: Wait for Studio images of this release
        if: steps.drift.outputs.drift == 'true' && vars.STUDIO_AUTO_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            run="$(gh run list --workflow studio.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
            case "$run" in
              'completed success') exit 0 ;;
              completed*) echo "::error::„Studio quality and images” dla $GITHUB_SHA zakończył się: $run. Studio nie zostało wdrożone."; exit 1 ;;
              '') if [ "$attempt" -ge 15 ]; then echo "::error::Brak przebiegu „Studio quality and images” dla $GITHUB_SHA."; exit 1; fi ;;
            esac
            sleep 20
          done
          echo "::error::Obrazy Studio dla $GITHUB_SHA nie są gotowe po 33 minutach."
          exit 1

      - name: Deploy Studio
        if: steps.drift.outputs.drift == 'true' && vars.STUDIO_AUTO_DEPLOY == 'true'
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: |
          set -euo pipefail
          printf '%s' "$CR_PAT" | ssh vps "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"
          # deploy.sh of this release, uploaded to a temp file: the VPS checkout is not updated by CI.
          ssh vps "f=\$(mktemp) && cat > \"\$f\" && bash \"\$f\" ${GITHUB_SHA} < /dev/null; s=\$?; rm -f \"\$f\"; exit \$s" < scripts/studio/deploy.sh
