name: Deploy to VPS

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: bekapaka-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            site/package-lock.json
            cms-app/package-lock.json
            packages/safari-overlay/package-lock.json
      - name: Shared Safari overlay dependencies
        working-directory: packages/safari-overlay
        run: npm ci
      - name: Backend tests and Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          npm test -- --run
      - name: KALK scraper fetch regressions
        run: |
          python3 -m venv /tmp/bkpk-scraper-tests
          /tmp/bkpk-scraper-tests/bin/pip install -r backend/scripts/requirements.txt
          (cd backend/scripts && /tmp/bkpk-scraper-tests/bin/python -m unittest discover -p 'test_kalk_*.py' -v)
      - name: CMS backup helper regressions
        run: python3 -m unittest discover -s scripts/vps -p 'test_cms_release.py' -v
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Public site quality
        working-directory: site
        run: |
          npm ci
          npm test
          npm run quality
      - name: CMS build
        working-directory: cms-app
        run: |
          npm ci
          npm run build
      - name: Dependency audit (critical gate)
        run: |
          set -euo pipefail
          for service in backend frontend site cms-app; do
            echo "::group::${service} production dependencies"
            (cd "$service" && npm audit --omit=dev --audit-level=critical)
            echo '::endgroup::'
          done

  docker-build-smoke:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile.prod
          - name: site
            context: .
            dockerfile: ./site/Dockerfile.prod
          - name: cms
            context: ./cms-app
            dockerfile: ./cms-app/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

      - name: Build and push public Site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/site:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/site:latest

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: ./cms-app
          file: ./cms-app/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cms:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cms:latest

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/bekapaka-stats/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: CR_PAT,GITHUB_ACTOR,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID
          script: |
            set -euo pipefail
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd /opt/bekapaka-stats
            rollback_tag="rollback-${GITHUB_RUN_ID}"
            for service in backend frontend site; do
              old_image="$(docker inspect --format '{{.Image}}' "bkpk-${service}-prod")"
              docker tag "$old_image" "ghcr.io/${GITHUB_REPOSITORY}/${service}:${rollback_tag}"
            done
            export BKPK_IMAGE_TAG="$GITHUB_SHA"
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull bkpk-backend bkpk-frontend bkpk-site
            deployed=()
            rollback() {
              echo 'Wdrażanie nieudane; przywracam poprzednie obrazy zmienionych usług.' >&2
              export BKPK_IMAGE_TAG="$rollback_tag"
              for ((i=${#deployed[@]}-1; i>=0; i--)); do
                docker compose -f docker-compose.prod.yml up -d --no-deps "bkpk-${deployed[i]}" || true
              done
            }
            deploy_one() {
              service="$1"
              endpoint="$2"
              deployed+=("$service")
              if ! docker compose -f docker-compose.prod.yml up -d --no-deps "bkpk-$service"; then
                rollback
                exit 1
              fi
              healthy=false
              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 3 "$endpoint" >/dev/null; then
                  healthy=true
                  break
                fi
                sleep 2
              done
              if [ "$healthy" != true ]; then
                echo "Kontrola zdrowia usługi $service nie powiodła się." >&2
                rollback
                exit 1
              fi
            }
            deploy_one backend http://127.0.0.1:4001/api/health
            deploy_one site http://127.0.0.1:8082/
            deploy_one frontend http://127.0.0.1:8081/
