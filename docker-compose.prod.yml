version: "3.9"

services:
  bkpk-db:
    image: postgres:15-alpine
    container_name: bkpk-db-prod
    restart: always
    environment:
      POSTGRES_USER: bekapaka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bekapaka_stats
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - bkpk-network

  bkpk-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bkpk-backend:local
    container_name: bkpk-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgres://bekapaka:${DB_PASSWORD}@bkpk-db:5432/bekapaka_stats
      DB_HOST: bkpk-db
      DB_USER: bekapaka
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: bekapaka_stats
      NODE_ENV: production
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      TZ: Europe/Warsaw
    depends_on:
      - bkpk-db
    ports:
      - "4001:4001"
    networks:
      - bkpk-network

  bkpk-frontend:
    image: ghcr.io/endurance71/bekapaka-stats/frontend:latest
    container_name: bkpk-frontend-prod
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - bkpk-backend
    networks:
      - bkpk-network

  bkpk-site:
    build:
      context: ./site
      dockerfile: Dockerfile.prod
    container_name: bkpk-site-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_CMS_API_URL: ${SITE_CMS_API_URL:-http://bkpk-cms:1337}
      SITE_BACKEND_API_URL: ${SITE_BACKEND_API_URL:-http://bkpk-backend:4001}
      SITE_CMS_TOKEN: ${SITE_CMS_TOKEN:-}
    ports:
      - "8082:3000"
    depends_on:
      - bkpk-backend
      - bkpk-cms
    networks:
      - bkpk-network

  bkpk-cms:
    build:
      context: ./cms-app
      dockerfile: Dockerfile.prod
    container_name: bkpk-cms-prod
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${CMS_APP_KEYS:-bkpkKey1,bkpkKey2,bkpkKey3,bkpkKey4}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:-bkpk-cms-api-token-salt}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:-bkpk-cms-admin-jwt-secret}
      JWT_SECRET: ${CMS_JWT_SECRET:-bkpk-cms-jwt-secret}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:-bkpk-cms-transfer-token-salt}
    ports:
      - "1337:1337"
    networks:
      - bkpk-network

networks:
  bkpk-network:
    name: bkpk-network
    driver: bridge
