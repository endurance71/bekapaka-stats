services:
  bkpk-db:
    image: postgres:15-alpine
    container_name: bkpk-db-prod
    restart: always
    environment:
      POSTGRES_USER: bekapaka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bekapaka_stats
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - bkpk-network

  bkpk-backend:
    image: ghcr.io/endurance71/bekapaka-stats/backend:${BKPK_IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: bkpk-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgres://bekapaka:${DB_PASSWORD}@bkpk-db:5432/bekapaka_stats
      DB_HOST: bkpk-db
      DB_USER: bekapaka
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: bekapaka_stats
      NODE_ENV: production
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      STUDIO_OWNER_ID: ${STUDIO_OWNER_ID:-}
      STUDIO_ORIGIN: https://studio.bekapaka.pl
      STUDIO_STORAGE_DIR: /data/studio
      STUDIO_CMS_URL: http://bkpk-cms:1337
      STUDIO_CMS_TOKEN: ${STUDIO_CMS_TOKEN:-}
      # Studio → szkice aktualności w Strapi (custom API token: news-post, upload, media-record). Pusty = funkcja wyłączona.
      STUDIO_CMS_WRITE_TOKEN: ${STUDIO_CMS_WRITE_TOKEN:-}
      STUDIO_SITE_URL: https://bekapaka.pl
      STUDIO_SITE_PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      STUDIO_GEMINI_API_KEY: ${STUDIO_GEMINI_API_KEY:-}
      STUDIO_ANTHROPIC_API_KEY: ${STUDIO_ANTHROPIC_API_KEY:-}
      STUDIO_OPENAI_API_KEY: ${STUDIO_OPENAI_API_KEY:-}
      STUDIO_SECRETS_KEY: ${STUDIO_SECRETS_KEY:-}
      STUDIO_AI_BUDGET_USD: ${STUDIO_AI_BUDGET_USD:-10}
      # Silnik „Claude Agent SDK” (Ustawienia → Dostawca AI): klucz API z Claude Console, np. z organizacji podpiętej
      # do planu Max (kredyty API). Nigdy token logowania subskrypcji. Pusty = silnik SDK niedostępny, API działa dalej.
      AGENT_SDK_ANTHROPIC_API_KEY: ${AGENT_SDK_ANTHROPIC_API_KEY:-}
      AGENT_SDK_PANEL_MAX_USD: ${AGENT_SDK_PANEL_MAX_USD:-0.5}
      KALK_CRON_SECRET: ${KALK_CRON_SECRET}
      KALK_DATA_DIR: /data/kalk
      # Zapis prezentacji meczu w panelu odświeża stronę przez sieć Docker (backend/matchPresentation.js).
      SITE_BASE_URL: http://bkpk-site:3000
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-${PREVIEW_SECRET:-}}
      TZ: Europe/Warsaw
    volumes:
      - ./data/studio:/data/studio
      - ./data/kalk:/data/kalk
    depends_on:
      - bkpk-db
    ports:
      - "127.0.0.1:4001:4001"
    networks:
      - bkpk-network

  bkpk-frontend:
    image: ghcr.io/endurance71/bekapaka-stats/frontend:${BKPK_IMAGE_TAG:-latest}
    container_name: bkpk-frontend-prod
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - bkpk-backend
    networks:
      - bkpk-network

  bkpk-site:
    image: ghcr.io/endurance71/bekapaka-stats/site:${BKPK_IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: bkpk-site-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_CMS_API_URL: ${SITE_CMS_API_URL:-http://bkpk-cms:1337}
      SITE_CMS_PUBLIC_URL: ${SITE_CMS_PUBLIC_URL:-https://cms.bekapaka.pl}
      SITE_BACKEND_API_URL: ${SITE_BACKEND_API_URL:-http://bkpk-backend:4001}
      SITE_CMS_TOKEN: ${SITE_CMS_TOKEN:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-https://bekapaka.pl}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
      # Dane klubu (site/lib/site-settings.ts) — puste = wartości domyślne strony.
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
      SITE_PRIVACY_URL: ${SITE_PRIVACY_URL:-}
      SITE_ASSOCIATION_KRS: ${SITE_ASSOCIATION_KRS:-}
      SITE_PARTNER_LEVELS_APPROVED: ${SITE_PARTNER_LEVELS_APPROVED:-}
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      - bkpk-backend
      - bkpk-cms
    networks:
      - bkpk-network

  bkpk-cms:
    image: ghcr.io/endurance71/bekapaka-stats/cms:${BKPK_CMS_IMAGE_TAG:-legacy}
    pull_policy: missing
    container_name: bkpk-cms-prod
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${CMS_APP_KEYS:?CMS_APP_KEYS required}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:?CMS_API_TOKEN_SALT required}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:?CMS_ADMIN_JWT_SECRET required}
      JWT_SECRET: ${CMS_JWT_SECRET:?CMS_JWT_SECRET required}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:?CMS_TRANSFER_TOKEN_SALT required}
      CLIENT_URL: ${CLIENT_URL:-https://bekapaka.pl}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    volumes:
      - ./data/cms-data:/opt/app/.tmp
      - ./data/cms-uploads:/opt/app/public/uploads
    ports:
      - "127.0.0.1:1337:1337"
    networks:
      - bkpk-network

  bkpk-studio:
    profiles: [studio]
    image: ghcr.io/endurance71/bekapaka-stats/studio:${BKPK_STUDIO_IMAGE_TAG:-latest}
    container_name: bkpk-studio-prod
    restart: unless-stopped
    ports: ["127.0.0.1:8083:80"]
    depends_on: [bkpk-backend]
    mem_limit: 128m
    cpus: 0.25
    networks: [bkpk-network]

  bkpk-studio-worker:
    profiles: [studio]
    image: ghcr.io/endurance71/bekapaka-stats/studio-worker:${BKPK_STUDIO_IMAGE_TAG:-latest}
    container_name: bkpk-studio-worker-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bekapaka:${DB_PASSWORD}@bkpk-db:5432/bekapaka_stats
      STUDIO_OWNER_ID: ${STUDIO_OWNER_ID:-}
      STUDIO_STORAGE_DIR: /data/studio
      STUDIO_GEMINI_API_KEY: ${STUDIO_GEMINI_API_KEY:-}
      STUDIO_ANTHROPIC_API_KEY: ${STUDIO_ANTHROPIC_API_KEY:-}
      STUDIO_OPENAI_API_KEY: ${STUDIO_OPENAI_API_KEY:-}
      STUDIO_SECRETS_KEY: ${STUDIO_SECRETS_KEY:-}
      STUDIO_AI_TEXT_MODEL: ${STUDIO_AI_TEXT_MODEL:-gemini-3.5-flash}
      STUDIO_AI_IMAGE_MODEL: ${STUDIO_AI_IMAGE_MODEL:-gemini-3.1-flash-image}
      STUDIO_AI_BUDGET_USD: ${STUDIO_AI_BUDGET_USD:-10}
      AGENT_SDK_ANTHROPIC_API_KEY: ${AGENT_SDK_ANTHROPIC_API_KEY:-}
      TZ: Europe/Warsaw
    volumes: ["./data/studio:/data/studio"]
    depends_on: [bkpk-db]
    # Render (Python) i lane AI działają równolegle; SDK uruchamia osobny proces Claude Code na każde wywołanie.
    mem_limit: 1536m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [bkpk-network]

networks:
  bkpk-network:
    name: bkpk-network
    driver: bridge
